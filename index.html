  <style>
    :root {

    .header { background:#1e293b; color:#fff; padding:12px 16px; border-radius:12px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }

    .stats-group, .action-group { display:flex; flex-wrap:wrap; gap:5px; }

    .btn-excel { background:#16a34a; color:#fff; border-color:#15803d; }
    .riser-alert { display:none; background:#fff1f2; border:2px solid #f43f5e; color:#9f1239; padding:9px 12px; border-radius:10px; margin-bottom:10px; font-size:0.82rem; font-weight:700; }

    .riser-header { background:#f8fafc; color:#64748b; font-size:0.68rem; height:22px !important; font-weight:700; }
    .riser-header.warn { background:#ef4444 !important; color:#fff !important; }
    .floor-exit { background:#e2e8f0; font-weight:800; color:#334155; width:50px; font-size:0.72rem; }
    .floor-gap td { height:7px !important; background:#f1f5f9; border:none !important; }
    .facility-cell { background:#f1f5f9; color:#64748b; font-weight:700; font-size:0.7rem; }
    .duplex-cell { background:#f8fafc; color:#94a3b8; font-size:0.7rem; }
    .empty-cell { background:#f8fafc; }

    .room-num { display:block; font-size:0.76rem; font-weight:800; }
    .room-badge { display:block; font-size:0.58rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .room-time { display:block; font-size:0.55rem; font-weight:600; }
    .hist-dot { position:absolute; top:2px; right:2px; background:#16a34a; color:#fff; font-size:0.55rem; width:13px; height:13px; line-height:13px; border-radius:50%; font-weight:900; }
    .status-heat { background:var(--heat) !important; color:var(--heat-t) !important; border:2px solid var(--heat-b) !important; }
    .status-water { background:var(--water) !important; color:var(--water-t) !important; border:2px solid var(--water-b) !important; }
    .status-both { background:var(--both) !important; color:var(--both-t) !important; border:2px solid var(--both-b) !important; }
    .status-work { background:var(--work) !important; color:var(--work-t) !important; border:2px solid var(--work-b) !important; }
    .status-block { background:var(--block) !important; color:var(--block-t) !important; border:2px solid var(--block-b) !important; }
    .dimmed { opacity:0.15; pointer-events:none; }
    .issue-panel { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    .issue-panel h2 { font-size:0.95rem; margin-bottom:10px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px; }
    .issue-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; }
    .issue-card { border:1px solid #cbd5e1; border-left:5px solid #64748b; border-radius:10px; padding:10px; background:#fff; cursor:pointer; }
    .issue-card.heat { border-left-color:var(--heat-b); }
    .issue-card.water { border-left-color:var(--water-b); }
    .issue-card.both { border-left-color:var(--both-b); }
    .issue-card.work { border-left-color:var(--work-b); }
    .issue-card.block { border-left-color:var(--block-b); }
    .issue-card.normal { border-left-color:var(--done-b); background:#f8fafc; }
    .issue-card-top { display:flex; justify-content:space-between; font-weight:800; font-size:0.9rem; margin-bottom:6px; }
    .time-box { background:#f8fafc; padding:6px 8px; border-radius:6px; font-size:0.74rem; margin-bottom:6px; border:1px solid #e2e8f0; }
    .time-row { display:flex; justify-content:space-between; margin-bottom:2px; }
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(15,23,42,0.65); z-index:100; justify-content:center; align-items:center; padding:12px; }
    .modal-backdrop.show { display:flex; }
    .modal { background:#fff; border-radius:14px; width:100%; max-width:460px; padding:16px; max-height:92vh; overflow-y:auto; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid #e2e8f0; padding-bottom:8px; }
    .close-btn { background:none; border:none; font-size:1.5rem; cursor:pointer; color:#64748b; }
    .section-label { font-size:0.76rem; font-weight:800; color:#334155; margin:10px 0 5px; display:flex; justify-content:space-between; align-items:center; }
    .status-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
    .status-btn { padding:9px 6px; border-radius:8px; border:2px solid #cbd5e1; background:#fff; font-weight:800; font-size:0.82rem; cursor:pointer; }
    .status-btn.selected { outline:3px solid #0f172a; }
    .status-btn.normal { grid-column:span 2; background:#f0fdf4; border-color:#22c55e; color:#15803d; }
    .status-btn.heat { background:var(--heat); border-color:var(--heat-b); color:var(--heat-t); }
